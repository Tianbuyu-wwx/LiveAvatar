[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveavatar"
version = "0.4.0"
description = "Real-time streaming talking-head avatar: PCM audio in, MuseTalk lip-synced video out, delivered over a self-developed WebSocket transport."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
vision = ["opencv-python"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
inference = [
    "torch",
    "torchvision",
]
# GPT-SoVITS vendored TTS engine implicit deps (third_party/GPT_SoVITS):
# transformers is used by cnhubert/TextPreprocessor/g2pw, einops by
# module/core_vq.py. The MuseTalk inference path itself (self-written VAE /
# UNet / Whisper encoder) needs only torch + torchvision.
tts = [
    "torchaudio",
    "librosa",
    "fast_langdetect",
    "einops",
    "transformers",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-timeout",
    "httpx2",
    "websockets>=12",
    "opencv-python-headless",
    "ruff",
    "mypy",
]
# R1 M5: MediaPipe is a training-time teacher only (pseudo-labeling own
# material, legacy backend during transition) — NOT a runtime dependency.
teacher = ["mediapipe"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/liveavatar"]
omit = [
    "src/liveavatar/musetalk/*",
    # Torch/GPU inference module — covered by real-GPU integration runs,
    # not by CPU CI (fake-model tests run only where torch is installed).
    "src/liveavatar/musetalk_worker.py",
    # R1 face models: torch-only; their tests are skipped in the light CI
    # env (skipUnless(torch)), so exclude them from the coverage gate too.
    "src/liveavatar/face_self.py",
    "src/liveavatar/face_landmarks.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/liveavatar/musetalk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = ["src/liveavatar"]
exclude = "musetalk[/\\\\]"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "liveavatar.musetalk.*"
ignore_errors = true
