[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveavatar"
version = "0.4.0"
description = "Real-time streaming talking-head avatar: PCM audio in, MuseTalk lip-synced video out, delivered over a self-developed WebSocket transport."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
# DEPRECATED since 0.4.0 — the self-developed ws transport is the default.
# Kept for a transition period (removal planned after two minor releases).
livekit = ["livekit>=1.1"]
vision = ["opencv-python"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
inference = [
    "torch",
    "torchvision",
    "diffusers",
    "transformers",
    "einops",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "httpx2",
    "websockets>=12",
    "opencv-python-headless",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/liveavatar"]
omit = [
    "src/liveavatar/musetalk/*",
    # Torch/GPU inference module — covered by real-GPU integration runs,
    # not by CPU CI (fake-model tests run only where torch is installed).
    "src/liveavatar/musetalk_worker.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/liveavatar/musetalk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = ["src/liveavatar"]
exclude = "musetalk[/\\\\]"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "liveavatar.musetalk.*"
ignore_errors = true
