services:
  liveavatar:
    build: .
    restart: unless-stopped
    environment:
      # Video transport: self-developed ws transport is the default and
      # needs no extra infrastructure. codec: "mjpeg" (full frames) or
      # "region" (region-delta, requires each avatar's region.json).
      LIVEAVATAR_TRANSPORT: ws
      LIVEAVATAR_CODEC: mjpeg
      # Avatar inference
      LIVEAVATAR_DEVICE: cuda
      LIVEAVATAR_WHISPER_MODEL_PATH: /app/models/whisper
      LIVEAVATAR_MUSETALK_MODEL_DIR: /app/models/musetalkV15
      LIVEAVATAR_VAE_MODEL_DIR: /app/models/sd-vae-ft-mse
      LIVEAVATAR_AVATAR_DATA_ROOT: /app/data/avatars
      NVIDIA_VISIBLE_DEVICES: all
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    # GPU (requires nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Legacy LiveKit transport (deprecated): set LIVEAVATAR_TRANSPORT=livekit
# plus LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET and run
# `docker run -p 7880:7880 -v ./livekit.yaml:/etc/livekit.yaml:ro livekit/livekit-server`
# alongside this service if you still need it.
