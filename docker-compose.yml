services:
  liveavatar:
    build: .
    restart: unless-stopped
    environment:
      # Video transport: self-developed ws transport. codec: "mjpeg"
      # (full frames) or "region" (region-delta, requires each avatar's
      # region.json).
      LIVEAVATAR_CODEC: mjpeg
      # Avatar inference
      LIVEAVATAR_DEVICE: cuda
      LIVEAVATAR_WHISPER_MODEL_PATH: /app/models/whisper
      LIVEAVATAR_MUSETALK_MODEL_DIR: /app/models/musetalkV15
      LIVEAVATAR_VAE_MODEL_DIR: /app/models/sd-vae-ft-mse
      LIVEAVATAR_AVATAR_DATA_ROOT: /app/data/avatars
      NVIDIA_VISIBLE_DEVICES: all
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    # GPU (requires nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
