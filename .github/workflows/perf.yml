name: Perf (nightly)

# PERF-1: nightly performance regression gate — CPU only.
# perf_gate: wsperf synthetic fps floor + committed bitrate band (±20 %);
# capacity_report: 3 concurrent sessions with built-in gates (per-session
# fps ≥ 20, interruption p95 ≤ 90 ms, zero starvation). Both exit non-zero
# on a gate miss, so the nightly run goes red on silent regressions.
# micro_bench is record-only (shared runners are too noisy for
# micro-timing gates); its JSON lands in the job log for trend tracking.
on:
  schedule:
    # 21:30 UTC = 05:30 Beijing — off-peak, before the working day.
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (not mutable tags) to close the
      # tag-hijacking supply-chain risk. Bump deliberately.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"

      - name: wsperf synthetic gate (fps floor + bitrate band)
        run: python scripts/perf_gate.py

      - name: Capacity report (3 concurrent sessions, built-in gates)
        run: python scripts/capacity_report.py --sessions 3 --seconds 10

      - name: Micro-benchmarks (record-only)
        run: python scripts/micro_bench.py --frames 1000
