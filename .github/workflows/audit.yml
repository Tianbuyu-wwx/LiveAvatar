name: Dependency audit

# Weekly vulnerability scan of the installed dependency set (pip-audit).
# Runs standalone so audit failures never block the test matrix.
on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
          pip install pip-audit

      - name: Audit installed packages
        # --strict: fail when a package cannot be audited (no silent skips).
        # Vulnerabilities in the toolchain itself are reported and must be
        # triaged by bumping the offending pin in pyproject.toml.
        run: pip-audit --strict
