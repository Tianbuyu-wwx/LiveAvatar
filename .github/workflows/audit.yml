name: Dependency audit

# Weekly vulnerability scan of the installed dependency set (pip-audit).
# Runs standalone so audit failures never block the test matrix.
on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
          pip install pip-audit

      - name: Audit installed packages
        # --strict: fail when a package cannot be audited (no silent skips).
        # The project itself is installed editable (`pip install -e .`) and is
        # not on PyPI, so auditing the raw environment trips --strict with
        # "Dependency not found on PyPI: liveavatar" (CI red since 2026-09-07).
        # Export the resolved set minus editable installs and audit that list;
        # every third-party dependency (incl. the toolchain) is still audited
        # strictly against the PyPI vulnerability database.
        run: |
          python -m pip freeze --exclude-editable > /tmp/audit-reqs.txt
          pip-audit --strict -r /tmp/audit-reqs.txt
