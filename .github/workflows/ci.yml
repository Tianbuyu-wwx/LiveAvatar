name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions are pinned to commit SHAs (not mutable tags) to close the
      # tag-hijacking supply-chain risk. Bump deliberately.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests with coverage
        # A stalled test fails after 120 s (with stack in the log) instead of
        # hanging the job until the runner limit.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=83 --timeout=120

  web-syntax:
    # The browser demo is dependency-free vanilla JS (no build chain), so a
    # full vitest setup is not warranted; `node --check` gates syntax errors.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Syntax check (node --check)
        run: |
          for f in web/*.js; do
            node --check "$f"
          done
