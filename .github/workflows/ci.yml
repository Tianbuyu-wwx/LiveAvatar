name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests with coverage
        # A stalled test fails after 120 s (with stack in the log) instead of
        # hanging the job until the runner limit.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80 --timeout=120

  web-syntax:
    # The browser demo is dependency-free vanilla JS (no build chain), so a
    # full vitest setup is not warranted; `node --check` gates syntax errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (node --check)
        run: |
          for f in web/*.js; do
            node --check "$f"
          done
