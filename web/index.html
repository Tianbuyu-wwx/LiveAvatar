<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveAvatar demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; gap: 16px; padding: 32px 16px;
    font-family: system-ui, sans-serif; background: #101418; color: #e6e6e6;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
  #stage {
    width: min(480px, 92vw); aspect-ratio: 9/16; background: #000;
    border-radius: 12px; overflow: hidden; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  canvas { width: 100%; height: 100%; object-fit: cover; display: none; }
  #placeholder { color: #555; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  input[type="file"] { color: #aaa; font-size: 13px; max-width: 240px; }
  button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #2c88d9;
    background: #174a75; color: #fff; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.danger { border-color: #d92c2c; background: #751717; }
  #status { font-size: 13px; color: #8ab4f8; min-height: 18px; }
  .hint { font-size: 12px; color: #666; max-width: 480px; text-align: center; }
</style>
</head>
<body>
  <h1>LiveAvatar</h1>
  <div id="stage">
    <span id="placeholder">avatar video appears here</span>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">未连接</div>
  <div id="vstats" style="font-size:12px;color:#666;min-height:16px"></div>
  <div class="row">
    <input type="file" id="wavFile" accept=".wav,audio/wav">
    <button id="startBtn" disabled>开始</button>
    <button id="stopBtn" class="danger" disabled>打断</button>
  </div>
  <p class="hint">
    选择一个 16-bit PCM wav（16kHz 单声道最佳），点「开始」：浏览器把音频切片经
    WebSocket 送给服务端，MuseTalk 实时生成口型视频经自研 WebSocket 视频传输
    推回本页（canvas 渲染）。播放中点「打断」可验证 epoch 打断（视频 ≤ 1 帧内停止）。
  </p>
  <script type="module" src="/app.js"></script>
</body>
</html>
